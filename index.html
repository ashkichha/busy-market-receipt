<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Busy Market Receipt App</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel Standalone CDN -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #2F4F4F; }
    .busy-box-shadow { box-shadow: inset 1px 1px 0px #fff, inset -1px -1px 0px #707070, 2px 2px 5px rgba(0,0,0,0.3); }
    .busy-btn { background: #ECE9D8; border-top: 1px solid #fff; border-left: 1px solid #fff; border-right: 1px solid #707070; border-bottom: 1px solid #707070; }
    .busy-btn:active { border-top: 1px solid #707070; border-left: 1px solid #707070; border-right: 1px solid #fff; border-bottom: 1px solid #fff; }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen p-2">

  <div id="root" class="w-full max-w-4xl"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // डिफ़ॉल्ट डेटा (पार्टियां और उनके पेंडिंग बिल)
    const INITIAL_PARTIES = [
      {
        busy_code: "1001",
        party_name: "Shree Ganesh Traders",
        mobile: "9876543210",
        current_balance: 14500.00,
        bills: [
          { bill_no: "INV/26/0101", bill_date: "2026-09-15", original_amount: 8000, pending_amount: 5000 },
          { bill_no: "INV/26/0114", bill_date: "2026-10-02", original_amount: 9500, pending_amount: 9500 }
        ]
      },
      {
        busy_code: "1002",
        party_name: "Kichha Kirana Store",
        mobile: "9123456780",
        current_balance: 6200.00,
        bills: [
          { bill_no: "INV/26/0095", bill_date: "2026-09-10", original_amount: 6200, pending_amount: 6200 }
        ]
      },
      {
        busy_code: "1003",
        party_name: "Om Sai Provision Store",
        mobile: "9988776655",
        current_balance: 3100.00,
        bills: [
          { bill_no: "INV/26/0122", bill_date: "2026-10-05", original_amount: 3100, pending_amount: 3100 }
        ]
      }
    ];

    const DEFAULT_TEMPLATE = `========================================
         [COMPANY_NAME]
      [COMPANY_ADDRESS]
     GSTIN: [COMPANY_GST] | Ph: [PHONE]
========================================
रसीद सं. : [VCH_NO]
तारीख    : [DATE] | समय: [TIME]
----------------------------------------
पार्टी नाम: [PARTY_NAME]
खाता कोड : [PARTY_CODE]
भुगतान   : [PAYMENT_MODE] ([REF_NO])
----------------------------------------
बिल एडजस्टमेंट विवरण (Bill Breakdown):
[BILL_BREAKDOWN]
----------------------------------------
कुल जमा राशि : Rs. [AMOUNT]
पिछला बकाया  : Rs. [OLD_BALANCE]
मौजूदा बकाया : Rs. [CURRENT_BALANCE]
----------------------------------------
संग्रहकर्ता   : [AGENT_NAME]
[FOOTER_NOTE]
========================================`;

    function App() {
      // 1. वाउचर नंबरिंग कॉन्फ़िग स्टेट
      const [vchConfig, setVchConfig] = useState({
        series: "Main",
        prefix: "AGT1/REC/",
        suffix: "/26-27",
        paddingLength: 5,
        currentNo: 142,
        allowManual: false
      });

      // 2. वाउचर फील्ड्स
      const [vchDate, setVchDate] = useState("2026-10-12");
      const [vchNo, setVchNo] = useState("");
      const [selectedPartyCode, setSelectedPartyCode] = useState("");
      const [amount, setAmount] = useState("");
      const [debitAccount, setDebitAccount] = useState("Cash in Hand");
      const [paymentMode, setPaymentMode] = useState("CASH");
      const [referenceNo, setReferenceNo] = useState("");
      const [narration, setNarration] = useState("Market Collection");

      // 3. बिल एडजस्टमेंट व टेम्प्लेट
      const [parties, setParties] = useState(INITIAL_PARTIES);
      const [adjustedBills, setAdjustedBills] = useState([]);
      const [onAccountAmount, setOnAccountAmount] = useState(0);
      const [template, setTemplate] = useState(DEFAULT_TEMPLATE);

      // 4. मॉडल्स
      const [showBillModal, setShowBillModal] = useState(false);
      const [showConfigModal, setShowConfigModal] = useState(false);
      const [showTemplateModal, setShowTemplateModal] = useState(false);
      const [showSlipModal, setShowSlipModal] = useState(false);
      const [lastSavedReceipt, setLastSavedReceipt] = useState(null);

      // वाउचर नंबर जेनरेटर
      const getFormattedVoucherNo = (config) => {
        const padded = String(config.currentNo).padStart(config.paddingLength, '0');
        return `${config.prefix}${padded}${config.suffix}`;
      };

      useEffect(() => {
        setVchNo(getFormattedVoucherNo(vchConfig));
      }, [vchConfig]);

      const selectedParty = parties.find(p => p.busy_code === selectedPartyCode);

      // कीबोर्ड शॉर्टकट्स: F2 (Save), Esc (Cancel)
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === "F2") {
            e.preventDefault();
            handleTriggerSave();
          } else if (e.key === "Escape") {
            e.preventDefault();
            closeAllModals();
          }
        };
        window.addEventListener("keydown", handleKeyDown);
        return () => window.removeEventListener("keydown", handleKeyDown);
      }, [selectedPartyCode, amount, adjustedBills, onAccountAmount]);

      const closeAllModals = () => {
        setShowBillModal(false);
        setShowConfigModal(false);
        setShowTemplateModal(false);
        setShowSlipModal(false);
      };

      // जब पार्टी और अमाउंट डाला जाए तो बिल विंडो खोलना
      const handleOpenBillAdjustment = () => {
        if (!selectedParty) {
          alert("कृपया पहले पार्टी चुनें!");
          return;
        }
        if (!amount || parseFloat(amount) <= 0) {
          alert("कृपया वैध राशि दर्ज करें!");
          return;
        }

        // FIFO ऑटो एलोकेशन
        let remaining = parseFloat(amount);
        const tempAllocations = selectedParty.bills.map(b => {
          if (remaining <= 0) return { ...b, allocated: 0 };
          const alloc = Math.min(remaining, b.pending_amount);
          remaining -= alloc;
          return { ...b, allocated: alloc };
        });

        setAdjustedBills(tempAllocations);
        setOnAccountAmount(remaining > 0 ? remaining : 0);
        setShowBillModal(true);
      };

      const handleTriggerSave = () => {
        if (!selectedPartyCode || !amount || parseFloat(amount) <= 0) {
          alert("कृपया पार्टी और राशि भरें!");
          return;
        }

        const amt = parseFloat(amount);
        const totalAdj = adjustedBills.reduce((sum, b) => sum + (b.allocated || 0), 0) + onAccountAmount;
        
        // अगर बिल एडजस्टमेंट नहीं किया गया है, तो डिफ़ॉल्ट रूप से पूरा On-Account सेट करें
        let currentAdjusted = adjustedBills;
        let currentOnAccount = onAccountAmount;

        if (totalAdj !== amt) {
          currentAdjusted = [];
          currentOnAccount = amt;
        }

        const receiptRecord = {
          vchNo,
          date: vchDate,
          partyCode: selectedParty.busy_code,
          partyName: selectedParty.party_name,
          amount: amt,
          debitAccount,
          paymentMode,
          referenceNo,
          narration,
          oldBalance: selectedParty.current_balance,
          newBalance: selectedParty.current_balance - amt,
          adjustedBills: currentAdjusted,
          onAccountAmount: currentOnAccount
        };

        setLastSavedReceipt(receiptRecord);

        // पार्टी बैलेंस अपडेट (लोकल स्टेट)
        setParties(prev => prev.map(p => {
          if (p.busy_code === selectedParty.busy_code) {
            return { ...p, current_balance: p.current_balance - amt };
          }
          return p;
        }));

        // वाउचर नंबर बढ़ाएं
        setVchConfig(prev => ({ ...prev, currentNo: prev.currentNo + 1 }));

        setShowSlipModal(true);
      };

      // Busy XML फाइल डाउनलोड करना
      const downloadBusyXml = (receipt) => {
        let billXml = "";
        receipt.adjustedBills.forEach(b => {
          if (b.allocated > 0) {
            billXml += `
          <BILLREF>
            <RefType>Agst Ref</RefType>
            <RefNo>${b.bill_no}</RefNo>
            <Amount>${b.allocated.toFixed(2)}</Amount>
          </BILLREF>`;
          }
        });
        if (receipt.onAccountAmount > 0) {
          billXml += `
          <BILLREF>
            <RefType>On Account</RefType>
            <Amount>${receipt.onAccountAmount.toFixed(2)}</Amount>
          </BILLREF>`;
        }

        const xmlString = `<?xml version="1.0" encoding="utf-8"?>
<BUSYDATA>
  <VOUCHERS>
    <VOUCHER>
      <VchType>Receipt</VchType>
      <VchSeries>${vchConfig.series}</VchSeries>
      <Date>${receipt.date}</Date>
      <VchNo>${receipt.vchNo}</VchNo>
      <ITEM>
        <AccountName>${receipt.partyName}</AccountName>
        <Amount>${receipt.amount.toFixed(2)}</Amount>
        <D_C>C</D_C>
        <ShortNarration>${receipt.narration} | Ref: ${receipt.referenceNo || 'N/A'}</ShortNarration>
        <BILLREFERENCES>
          ${billXml}
        </BILLREFERENCES>
      </ITEM>
      <ITEM>
        <AccountName>${receipt.debitAccount}</AccountName>
        <Amount>${receipt.amount.toFixed(2)}</Amount>
        <D_C>D</D_C>
      </ITEM>
    </VOUCHER>
  </VOUCHERS>
</BUSYDATA>`;

        const blob = new Blob([xmlString], { type: "text/xml" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `REC_${receipt.vchNo.replace(/[\/\\:]/g, '_')}.xml`;
        a.click();
      };

      // रसीद प्रिंट टेक्स्ट तैयार करना
      const generateReceiptSlipText = (receipt) => {
        if (!receipt) return "";
        let breakdown = "";
        receipt.adjustedBills.forEach(b => {
          if (b.allocated > 0) {
            breakdown += `${b.bill_no.padEnd(14)} Rs. ${b.allocated.toFixed(2)}\n`;
          }
        });
        if (receipt.onAccountAmount > 0) {
          breakdown += `[On Account]   Rs. ${receipt.onAccountAmount.toFixed(2)}\n`;
        }
        if (!breakdown) breakdown = "Direct On-Account Settlement\n";

        return template
          .replace("[COMPANY_NAME]", "SHREE RAM TRADERS")
          .replace("[COMPANY_ADDRESS]", "Main Market, Kichha (U.K.)")
          .replace("[COMPANY_GST]", "05AAACH1234F1Z1")
          .replace("[PHONE]", "9876543210")
          .replace("[VCH_NO]", receipt.vchNo)
          .replace("[DATE]", receipt.date)
          .replace("[TIME]", new Date().toLocaleTimeString())
          .replace("[PARTY_NAME]", receipt.partyName)
          .replace("[PARTY_CODE]", receipt.partyCode)
          .replace("[PAYMENT_MODE]", receipt.paymentMode)
          .replace("[REF_NO]", receipt.referenceNo || "N/A")
          .replace("[BILL_BREAKDOWN]", breakdown.trim())
          .replace("[AMOUNT]", receipt.amount.toFixed(2))
          .replace("[OLD_BALANCE]", receipt.oldBalance.toFixed(2) + " Dr")
          .replace("[CURRENT_BALANCE]", receipt.newBalance.toFixed(2) + " Dr")
          .replace("[AGENT_NAME]", "Aman (Agent-01)")
          .replace("[FOOTER_NOTE]", "** कंप्यूटर जनरेटेड अधिकृत रसीद **");
      };

      return (
        <div className="bg-[#ECE9D8] border-2 border-[#0055EA] shadow-2xl rounded-sm select-none text-xs">
          
          {/* 1. Header (Windows Classic Style) */}
          <div className="bg-gradient-to-r from-[#0055EA] to-[#3A80F6] text-white px-2 py-1 flex justify-between items-center font-bold tracking-wide">
            <div className="flex items-center gap-1.5">
              <span className="w-3.5 h-3.5 bg-white text-blue-900 flex items-center justify-center text-[10px] font-black border border-blue-900">B</span>
              <span>Receipt Voucher (Market Collection - Against Bills)</span>
            </div>
            <div className="flex items-center gap-1">
              <button onClick={() => setShowConfigModal(true)} className="busy-btn px-2 py-0.5 text-black text-[11px]">Series Setup</button>
              <button onClick={() => setShowTemplateModal(true)} className="busy-btn px-2 py-0.5 text-black text-[11px]">Design Slip</button>
            </div>
          </div>

          {/* 2. Metadata Bar */}
          <div className="p-3 bg-[#F0F0F0] border-b border-gray-400 grid grid-cols-1 md:grid-cols-4 gap-2">
            <div>
              <label className="block text-gray-700 font-semibold mb-0.5">Series</label>
              <select value={vchConfig.series} onChange={e => setVchConfig({...vchConfig, series: e.target.value})} className="w-full bg-white border border-gray-500 px-1 py-0.5 outline-none">
                <option value="Main">Main</option>
                <option value="Market">Market (Agent)</option>
              </select>
            </div>
            <div>
              <label className="block text-gray-700 font-semibold mb-0.5">Date</label>
              <input type="date" value={vchDate} onChange={e => setVchDate(e.target.value)} className="w-full bg-white border border-gray-500 px-1 py-0.5 outline-none font-mono" />
            </div>
            <div className="md:col-span-2">
              <label className="block text-gray-700 font-semibold mb-0.5">Voucher No. (Unique & Configurable)</label>
              <input 
                type="text" 
                value={vchNo} 
                readOnly={!vchConfig.allowManual} 
                onChange={e => setVchNo(e.target.value)} 
                className={`w-full border border-gray-500 px-2 py-0.5 font-mono font-bold ${vchConfig.allowManual ? 'bg-white' : 'bg-gray-200 text-blue-900'}`} 
              />
            </div>
          </div>

          {/* 3. Transaction Entry Grid */}
          <div className="p-3">
            <table className="w-full border-collapse border border-gray-500 bg-white">
              <thead>
                <tr className="bg-[#002D62] text-white">
                  <th className="border border-gray-400 p-1 w-10 text-center">D/C</th>
                  <th className="border border-gray-400 p-1 text-left">Account / Party Ledger Name</th>
                  <th className="border border-gray-400 p-1 w-28 text-right">Debit (₹)</th>
                  <th className="border border-gray-400 p-1 w-32 text-right">Credit (₹)</th>
                </tr>
              </thead>
              <tbody>
                {/* Credit Row (Party) */}
                <tr className="border-b border-gray-300">
                  <td className="border border-gray-400 text-center font-bold text-red-600 bg-gray-50">Cr</td>
                  <td className="border border-gray-400 p-1">
                    <select 
                      value={selectedPartyCode} 
                      onChange={e => { setSelectedPartyCode(e.target.value); setAdjustedBills([]); }} 
                      className="w-full border border-blue-400 p-1 font-semibold text-xs outline-none"
                    >
                      <option value="">-- ग्राहक / पार्टी चुनें --</option>
                      {parties.map(p => (
                        <option key={p.busy_code} value={p.busy_code}>
                          {p.party_name} (Code: {p.busy_code})
                        </option>
                      ))}
                    </select>
                    {selectedParty && (
                      <div className="text-[11px] text-gray-600 mt-1 flex justify-between items-center pr-2">
                        <span>कुल बकाया: <strong className="text-black">₹{selectedParty.current_balance.toFixed(2)} Dr</strong></span>
                        <button 
                          onClick={handleOpenBillAdjustment} 
                          className="busy-btn px-2 py-0.5 text-blue-900 font-bold hover:bg-yellow-100"
                        >
                          [ Bill-by-Bill Adj. ]
                        </button>
                      </div>
                    )}
                  </td>
                  <td className="border border-gray-400 bg-gray-100"></td>
                  <td className="border border-gray-400 p-1">
                    <input 
                      type="number" 
                      value={amount} 
                      onChange={e => setAmount(e.target.value)} 
                      placeholder="0.00" 
                      className="w-full text-right font-mono font-bold p-1 text-sm border border-blue-400 outline-none" 
                    />
                  </td>
                </tr>

                {/* Debit Row (Cash/Bank) */}
                <tr>
                  <td className="border border-gray-400 text-center font-bold text-green-700 bg-gray-50">Dr</td>
                  <td className="border border-gray-400 p-1">
                    <select value={debitAccount} onChange={e => setDebitAccount(e.target.value)} className="w-full border border-gray-300 p-1 text-xs">
                      <option value="Cash in Hand">Cash in Hand</option>
                      <option value="HDFC Bank Collection">HDFC Bank Collection</option>
                      <option value="SBI Collection">SBI Collection</option>
                    </select>
                  </td>
                  <td className="border border-gray-400 p-1">
                    <input type="text" readOnly value={amount ? parseFloat(amount).toFixed(2) : "0.00"} className="w-full text-right font-mono font-bold p-1 bg-gray-100 text-sm outline-none" />
                  </td>
                  <td className="border border-gray-400 bg-gray-100"></td>
                </tr>
              </tbody>
            </table>

            {/* Additional Fields */}
            <div className="mt-3 grid grid-cols-1 md:grid-cols-3 gap-2 bg-white p-2 border border-gray-400">
              <div>
                <label className="block text-gray-700 font-semibold mb-0.5">Payment Mode</label>
                <select value={paymentMode} onChange={e => setPaymentMode(e.target.value)} className="w-full border border-gray-400 p-1">
                  <option value="CASH">CASH</option>
                  <option value="UPI">UPI / GPay / QR</option>
                  <option value="CHEQUE">CHEQUE</option>
                </select>
              </div>
              <div>
                <label className="block text-gray-700 font-semibold mb-0.5">Reference / UTR / Cheque No.</label>
                <input 
                  type="text" 
                  value={referenceNo} 
                  disabled={paymentMode === "CASH"} 
                  onChange={e => setReferenceNo(e.target.value)} 
                  placeholder={paymentMode === "CASH" ? "Not Needed" : "Enter UTR/Cheque No."} 
                  className="w-full border border-gray-400 p-1 disabled:bg-gray-100 font-mono" 
                />
              </div>
              <div>
                <label className="block text-gray-700 font-semibold mb-0.5">Narration</label>
                <input type="text" value={narration} onChange={e => setNarration(e.target.value)} className="w-full border border-gray-400 p-1" />
              </div>
            </div>
          </div>

          {/* 4. Bottom Action Toolbar */}
          <div className="bg-[#D4D0C8] border-t border-white p-2 flex justify-between items-center">
            <div className="flex gap-2">
              <button onClick={handleTriggerSave} className="busy-btn px-4 py-1 text-black font-bold">
                <span className="text-blue-900 font-black">F2</span>: Done / Save
              </button>
              <button onClick={() => { setAmount(""); setSelectedPartyCode(""); setAdjustedBills([]); }} className="busy-btn px-4 py-1 text-black font-semibold">
                <span className="text-red-700 font-black">Esc</span>: Clear
              </button>
            </div>
            <div className="font-mono text-xs">
              बैलेंस पश्चात: <strong className="text-blue-900">₹{selectedParty ? (selectedParty.current_balance - (parseFloat(amount) || 0)).toFixed(2) : "0.00"} Dr</strong>
            </div>
          </div>

          {/* ================= MODAL: Bill-by-Bill Allocation ================= */}
          {showBillModal && selectedParty && (
            <div className="fixed inset-0 bg-black/60 flex items-center justify-center p-2 z-50">
              <div className="bg-[#ECE9D8] border-2 border-[#0055EA] w-full max-w-xl p-3 shadow-2xl">
                <div className="bg-[#002D62] text-white px-2 py-0.5 font-bold flex justify-between items-center mb-2">
                  <span>Bill-by-Bill Settlement ({selectedParty.party_name})</span>
                  <button onClick={() => setShowBillModal(false)} className="text-sm font-bold px-1 hover:bg-red-600">✕</button>
                </div>
                <div className="text-xs mb-2 font-semibold">
                  कलेक्शन राशि: <span className="font-mono text-blue-900 text-sm">₹{parseFloat(amount).toFixed(2)}</span>
                </div>
                <div className="bg-white border border-gray-400 max-h-60 overflow-y-auto">
                  <table className="w-full text-xs border-collapse">
                    <thead className="bg-[#0055EA] text-white">
                      <tr>
                        <th className="p-1 border border-gray-300">Bill No.</th>
                        <th className="p-1 border border-gray-300">Date</th>
                        <th className="p-1 border border-gray-300 text-right">Due (₹)</th>
                        <th className="p-1 border border-gray-300 text-right w-24 bg-yellow-100 text-black">Adj. Amt (₹)</th>
                      </tr>
                    </thead>
                    <tbody>
                      {adjustedBills.map((b, idx) => (
                        <tr key={b.bill_no} className="border-b">
                          <td className="p-1 border border-gray-300 font-mono font-semibold">{b.bill_no}</td>
                          <td className="p-1 border border-gray-300">{b.bill_date}</td>
                          <td className="p-1 border border-gray-300 text-right font-mono font-bold text-red-700">{b.pending_amount.toFixed(2)}</td>
                          <td className="p-1 border border-gray-300 bg-yellow-50">
                            <input 
                              type="number" 
                              value={b.allocated || ""} 
                              onChange={e => {
                                const val = parseFloat(e.target.value) || 0;
                                const copy = [...adjustedBills];
                                copy[idx].allocated = Math.min(val, b.pending_amount);
                                setAdjustedBills(copy);
                                const tot = copy.reduce((s, x) => s + (x.allocated || 0), 0);
                                setOnAccountAmount(Math.max(0, parseFloat(amount) - tot));
                              }} 
                              className="w-full text-right p-0.5 border border-blue-400 font-mono font-bold outline-none" 
                            />
                          </td>
                        </tr>
                      ))}
                      <tr className="bg-gray-100 font-semibold">
                        <td colSpan="3" className="p-1 border border-gray-300 text-purple-900">On Account (अग्रिम / बिना बिल की राशि)</td>
                        <td className="p-1 border border-gray-300 text-right font-mono font-bold text-purple-900 bg-purple-50">
                          {onAccountAmount.toFixed(2)}
                        </td>
                      </tr>
                    </tbody>
                  </table>
                </div>
                <div className="mt-3 flex justify-end gap-2">
                  <button onClick={() => setShowBillModal(false)} className="busy-btn px-4 py-1 font-bold text-blue-900">
                    Apply & Close
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ================= MODAL: Series Configuration ================= */}
          {showConfigModal && (
            <div className="fixed inset-0 bg-black/60 flex items-center justify-center p-2 z-50">
              <div className="bg-[#ECE9D8] border-2 border-blue-800 w-80 p-3 shadow-2xl">
                <div className="bg-[#002D62] text-white px-2 py-0.5 font-bold mb-2 flex justify-between">
                  <span>Voucher Numbering Setup</span>
                  <button onClick={() => setShowConfigModal(false)}>✕</button>
                </div>
                <div className="space-y-2 bg-white p-2 border border-gray-400 text-xs">
                  <div>
                    <label className="block text-gray-700">Prefix:</label>
                    <input type="text" value={vchConfig.prefix} onChange={e => setVchConfig({...vchConfig, prefix: e.target.value})} className="w-full border p-1" />
                  </div>
                  <div>
                    <label className="block text-gray-700">Suffix:</label>
                    <input type="text" value={vchConfig.suffix} onChange={e => setVchConfig({...vchConfig, suffix: e.target.value})} className="w-full border p-1" />
                  </div>
                  <div>
                    <label className="block text-gray-700">Padding Digits:</label>
                    <input type="number" value={vchConfig.paddingLength} onChange={e => setVchConfig({...vchConfig, paddingLength: parseInt(e.target.value)||1})} className="w-full border p-1" />
                  </div>
                  <div>
                    <label className="block text-gray-700">Next Number:</label>
                    <input type="number" value={vchConfig.currentNo} onChange={e => setVchConfig({...vchConfig, currentNo: parseInt(e.target.value)||1})} className="w-full border p-1" />
                  </div>
                  <div className="pt-1">
                    <label className="flex items-center gap-1.5">
                      <input type="checkbox" checked={vchConfig.allowManual} onChange={e => setVchConfig({...vchConfig, allowManual: e.target.checked})} />
                      <span>मैन्युअल संपादन की अनुमति दें</span>
                    </label>
                  </div>
                </div>
                <div className="mt-2 flex justify-end">
                  <button onClick={() => setShowConfigModal(false)} className="busy-btn px-4 py-1 font-bold text-blue-900">Save</button>
                </div>
              </div>
            </div>
          )}

          {/* ================= MODAL: Template Designer ================= */}
          {showTemplateModal && (
            <div className="fixed inset-0 bg-black/60 flex items-center justify-center p-2 z-50">
              <div className="bg-[#ECE9D8] border-2 border-blue-800 w-full max-w-lg p-3 shadow-2xl">
                <div className="bg-[#002D62] text-white px-2 py-0.5 font-bold mb-2 flex justify-between">
                  <span>Editable Receipt Template</span>
                  <button onClick={() => setShowTemplateModal(false)}>✕</button>
                </div>
                <p className="text-[11px] text-gray-700 mb-1">टोकन्स: [COMPANY_NAME], [VCH_NO], [DATE], [PARTY_NAME], [BILL_BREAKDOWN], [AMOUNT], [CURRENT_BALANCE]</p>
                <textarea rows={14} value={template} onChange={e => setTemplate(e.target.value)} className="w-full font-mono text-xs p-2 border border-gray-500 bg-white" />
                <div className="mt-2 flex justify-between">
                  <button onClick={() => setTemplate(DEFAULT_TEMPLATE)} className="busy-btn px-2 py-1 text-xs">Reset Default</button>
                  <button onClick={() => setShowTemplateModal(false)} className="busy-btn px-4 py-1 font-bold text-blue-900">Save Design</button>
                </div>
              </div>
            </div>
          )}

          {/* ================= MODAL: Print Slip & XML Export ================= */}
          {showSlipModal && lastSavedReceipt && (
            <div className="fixed inset-0 bg-black/60 flex items-center justify-center p-2 z-50">
              <div className="bg-white border-2 border-gray-800 w-96 p-3 shadow-2xl">
                <div className="text-center font-bold text-sm border-b pb-1 mb-2 text-gray-800">रसीद सफलतापूर्वक कट गई!</div>
                <pre className="font-mono text-[11px] bg-gray-50 p-2 border border-dashed border-gray-400 whitespace-pre-wrap leading-tight text-gray-900 max-h-80 overflow-y-auto">
                  {generateReceiptSlipText(lastSavedReceipt)}
                </pre>
                <div className="mt-3 grid grid-cols-2 gap-2">
                  <button onClick={() => window.print()} className="bg-blue-600 hover:bg-blue-700 text-white font-bold py-1.5 rounded text-xs">
                    Print Thermal Slip
                  </button>
                  <button onClick={() => downloadBusyXml(lastSavedReceipt)} className="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-1.5 rounded text-xs">
                    Export Busy XML
                  </button>
                </div>
                <button onClick={() => { setShowSlipModal(false); setAmount(""); setSelectedPartyCode(""); setAdjustedBills([]); }} className="w-full mt-2 bg-gray-200 hover:bg-gray-300 font-semibold py-1 rounded text-xs">
                  अगली रसीद बनाएं (Next)
                </button>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
